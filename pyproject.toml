[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsteward-data-connector-mcp-toolbox-spanner-extension"
version = "1.3.4"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Packaged checks use this repository's pinned database binaries under bin/.
# Plain checks validate connector logic without contacting an external database.
addopts = "-m 'not packaged'"
markers = [
    "packaged: needs this package's Toolbox binaries; runs inside each rendered variant",
    "variant_contract: what this package offers matches its variant",
]


# The Flow Steward extension gate runs ruff, mypy and bandit from this folder
# with this fixed database configuration.
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".fs-python", "dev-wheels", "wheels", "bin"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
exclude = "(^\\.fs-python/|^dev-wheels/|^wheels/|^bin/)"
