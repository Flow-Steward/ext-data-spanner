$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: Spanner connection settings
additionalProperties: false
required:
- prebuilt
- project
- instance
- database
properties:
  prebuilt:
    type: string
    enum:
    - spanner
    - spanner-postgres
    title: SQL interface
    default: spanner
    description: Choose Spanner (GoogleSQL) or Spanner (PostgreSQL). The selected interface fixes the
      SQL dialect and parameter binder.
  project:
    type: string
    title: Google Cloud project
    description: Spanner google cloud project.
  instance:
    type: string
    title: Spanner instance
    description: Spanner spanner instance.
  database:
    type: string
    title: Database
    description: Spanner database.
  env:
    type: object
    title: Advanced Spanner environment
    additionalProperties: false
    properties:
      SPANNER_PROJECT:
        type: string
      SPANNER_INSTANCE:
        type: string
      SPANNER_DATABASE:
        type: string
      GOOGLE_CLOUD_PROJECT:
        type: string
      GOOGLE_CLOUD_QUOTA_PROJECT:
        type: string
      GOOGLE_CLOUD_UNIVERSE_DOMAIN:
        type: string
      GOOGLE_API_USE_MTLS_ENDPOINT:
        type: string
      GOOGLE_API_USE_CLIENT_CERTIFICATE:
        type: string
      SPANNER_EMULATOR_HOST:
        type: string
    description: Optional Spanner source environment overrides only. Credentials belong in secrets.
