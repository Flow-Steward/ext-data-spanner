actions:
- action_id: execute_write
  title: 'SQL: Insert, update or delete rows'
  description: 'Write workflow results to Spanner using one parameterized INSERT, UPDATE or DELETE. Select
    a Spanner project connection with write permission. Example: save a processing result with INSERT
    INTO workflow_results (record_id, status) VALUES (:record_id, :status), then provide Parameters and
    a type for each named parameter. Use Dataset saved queries for read-only SELECTs. Test mode validates
    this action without writing; SQL syntax must be supported by the selected database.'
  workflow_visible: true
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  command_type: invoke_extension_action
  mutates_platform: true
  test_mode_behavior: suppress
  parameters:
  - name: connection_ref
    type: connection_ref
    required: true
    description: Select an existing project connection for Spanner, configured with the correct profile
      and credentials in connection secrets. Its database user needs permission to execute your statement.
  - name: sql
    type: string
    required: true
    description: Enter one INSERT, UPDATE or DELETE supported by the selected database. Bind values with
      :named placeholders, provide Parameters and declare every placeholder type. Use a Dataset saved
      query for SELECT reads.
  - name: params
    type: object
    required: false
    description: 'Object containing a value for every :named SQL placeholder. Bind workflow values here
      rather than inserting them into SQL text. Example: {"record_id":1042,"status":"approved"}.'
  - name: param_schema
    type: object
    required: false
    description: 'Declare a type for every :named SQL placeholder in properties, matching the Parameters
      object. Required when SQL uses parameters; omit only for SQL without placeholders. Supported types:
      string, integer, number, boolean and null.'
  result_fields:
  - result.status
  - result.rows
  - result.returned_row_count
  error_codes:
  - invalid_payload
  - write_outcome_unknown
- action_id: test_connection
  workflow_visible: false
  title: Test Spanner connection
  description: Validate the configured Spanner database connection.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.status
  - result.connector_id
  - result.metadata.toolbox_prebuilt
  error_codes:
  - invalid_config
  - not_found
  - permission_denied
  - connector_runtime_failed
  - unknown_action
- action_id: introspect_schema
  workflow_visible: false
  title: Inspect Spanner schema
  description: Return a typed dataset_schema_snapshot.v1 resource list.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.schema_snapshot.schema_version
  - result.schema_snapshot.resources[].resource_id
  - result.schema_snapshot.resources[].columns[].name
  - result.schema_snapshot.resources[].indexes[].columns[]
  - result.resource_count
  error_codes:
  - invalid_config
  - not_found
  - permission_denied
  - connector_runtime_failed
  - unknown_action
- action_id: validate_query
  workflow_visible: false
  title: Validate query template
  description: Validate read-only SQL and dataset resource scope.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.valid
  - result.read_only
  - result.referenced_resources[]
  error_codes:
  - invalid_config
  - connector_runtime_failed
  - unknown_action
- action_id: preview_query
  workflow_visible: false
  title: Preview query template
  description: Execute a bounded read-only preview.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.rows[]
  - result.row_count
  - result.output_schema
  error_codes:
  - invalid_config
  - connector_runtime_failed
  - unknown_action
- action_id: execute_template
  workflow_visible: false
  title: Execute query template
  description: Execute a saved read-only query template.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.rows[]
  - result.row_count
  - result.output_schema
  - result.truncated
  error_codes:
  - invalid_config
  - connector_runtime_failed
  - unknown_action
- action_id: infer_output_schema
  workflow_visible: false
  title: Infer output schema
  description: Infer output schema from a bounded preview.
  required_scopes:
  - extension:invoke
  handler:
    mode: extension
  mutates_platform: false
  result_fields:
  - result.output_schema
  error_codes:
  - invalid_config
  - connector_runtime_failed
  - unknown_action
