manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: flowsteward.data-connector-mcp-toolbox-spanner
kind: tool_provider
version: 1.3.0
release_stage: active
display_name: Spanner
description: Read Spanner datasets and run parameterized workflow writes.
vendor:
  name: Flow Steward
  support_url: https://github.com/Flow-Steward/ext-data-spanner/issues
  website_url: https://github.com/Flow-Steward/ext-data-spanner
listing:
  category: data
  tags:
  - database
  - dataset
  - spanner
  - spanner-postgres
  summary: Spanner dataset reads and workflow writes.
  description: Connect project-scoped Spanner databases for saved queries, schema introspection and
    parameterized workflow writes.
package:
  format: flow-steward-extension
  license: Apache-2.0
  includes_source: true
billing_mode: free
upgrade_notes: Database-specific setup and friendly names. Stable extension, connection and connector
  IDs are preserved.
screenshots:
- label: Overview
  description: Spanner connection and query overview.
  path: ui/components/overview.yaml
features:
- tool
- dataset_connector
- action
- query
required_scopes:
- extension:invoke
machine_auth:
  service_account_key: svc_ext_data_connector_mcp_toolbox_spanner
  required_scopes:
  - extension:invoke
account_scope:
  scope_type: project
  description: Spanner connections are project-scoped and use the configured database settings and credentials.
external_effects:
- operation_id: execute_write
  effect_kind: database_write
  channel: toolbox
  idempotency: required
  test_mode_behavior: suppress
schemas:
  config: schemas/config.schema.yaml
  secrets: schemas/secrets.schema.yaml
  subscriptions: schemas/subscriptions.schema.yaml
entrypoint:
  mode: subprocess
  command:
  - python3
  - main.py
health:
  command:
  - python3
  - health.py
  timeout_seconds: 5
ui_manifest: ui/ui_manifest.yaml
query_manifest: ui/queries/queries.yaml
action_manifest: ui/actions/actions.yaml
runtime:
  contract_version: extension_host_v2
  extension_contract_v2:
    connection_types:
    - connection_type_id: toolbox_sql_writer
      display_name: Spanner connection
      description: Project connection for parameterized Spanner workflow writes.
      config_schema:
        type: object
        title: Spanner connection settings
        additionalProperties: false
        required:
        - prebuilt
        - project
        - instance
        - database
        properties:
          prebuilt:
            type: string
            title: SQL interface
            enum: &id001
            - spanner
            - spanner-postgres
            default: spanner
            description: Spanner SQL interface; this extension cannot select another database.
          project:
            type: string
            title: Google Cloud project
            minLength: 1
            description: Spanner google cloud project.
          instance:
            type: string
            title: Spanner instance
            minLength: 1
            description: Spanner spanner instance.
          database:
            type: string
            title: Database
            minLength: 1
            description: Spanner database.
          dialect:
            type: string
            title: GoogleSQL profile dialect
            description: Dialect for the spanner profile. The spanner-postgres profile always uses PostgreSQL.
            enum:
            - googlesql
            - postgresql
            default: googlesql
      secret_schema:
        type: object
        title: Spanner credentials
        additionalProperties: false
        properties: {}
      capabilities:
        write_queries: true
      safety_profile:
        stores_secret_values: false
    dataset_connectors:
    - connector_id: toolbox_database
      connector_type_id: toolbox_database
      database_kind: database
      display_name: Spanner database
      description: Read-only Spanner schema introspection and saved query execution.
      source_kind: database
      source_extension_id: flowsteward.data-connector-mcp-toolbox-spanner
      source_extension_name: Spanner
      source_provider: Spanner
      query_language: sql
      access_mode: read_only
      runtime_kind: local_extension
      runtime_adapter_ref: extensions/flowsteward_data_connector_mcp_toolbox_spanner/main.py
      connector_catalog:
      - source_kind: spanner
        connector_type_id: toolbox_spanner
        display_name: Spanner (GoogleSQL)
        query_language: googlesql
        preset_config:
          prebuilt: spanner
      - source_kind: spanner-postgres
        connector_type_id: toolbox_spanner_postgres
        display_name: Spanner (PostgreSQL)
        query_language: sql
        preset_config:
          prebuilt: spanner-postgres
      connection_schema:
        type: object
        title: Spanner connection settings
        additionalProperties: false
        required:
        - prebuilt
        - project
        - instance
        - database
        properties:
          prebuilt:
            type: string
            title: SQL interface
            enum: *id001
            default: spanner
            description: Spanner SQL interface; this extension cannot select another database.
          project:
            type: string
            title: Google Cloud project
            description: Spanner google cloud project.
          instance:
            type: string
            title: Spanner instance
            description: Spanner spanner instance.
          database:
            type: string
            title: Database
            description: Spanner database.
          dialect:
            type: string
            title: GoogleSQL profile dialect
            description: Dialect for the spanner profile. The spanner-postgres profile always uses PostgreSQL.
            enum:
            - googlesql
            - postgresql
            default: googlesql
          env:
            type: object
            title: Advanced Spanner environment
            additionalProperties: false
            properties:
              SPANNER_PROJECT:
                type: string
              SPANNER_INSTANCE:
                type: string
              SPANNER_DATABASE:
                type: string
              SPANNER_DIALECT:
                type: string
              GOOGLE_CLOUD_PROJECT:
                type: string
              GOOGLE_CLOUD_QUOTA_PROJECT:
                type: string
              GOOGLE_CLOUD_UNIVERSE_DOMAIN:
                type: string
              GOOGLE_API_USE_MTLS_ENDPOINT:
                type: string
              GOOGLE_API_USE_CLIENT_CERTIFICATE:
                type: string
              SPANNER_EMULATOR_HOST:
                type: string
            description: Optional Spanner source environment overrides only. Credentials belong in secrets.
      secret_schema:
        type: object
        title: Spanner credentials
        additionalProperties: false
        properties:
          env:
            type: object
            title: Advanced Spanner secret environment
            additionalProperties: false
            properties:
              GOOGLE_APPLICATION_CREDENTIALS:
                type: string
            description: Optional server-side Application Default Credentials file path. No JSON key
              contents are accepted.
      capabilities:
        read_only: true
        test_connection: true
        schema_introspection: true
        validate_query: true
        preview_query: true
        execute_template: true
        infer_output_schema: true
        write_queries: false
        row_preview: true
      safety_profile:
        access_mode: read_only
        indexes_rows: false
        executes_write_queries: false
        requires_saved_template: true
      preview_support: true
      schema_refresh_support: true
    operation_manifest:
    - operation_id: execute_write
      display_name: Execute Spanner write
      workflow_visible: true
      operation_kind: action
      category: database
      description: Run one parameterized INSERT, UPDATE or DELETE on the selected Spanner project connection.
      connection_type_ids:
      - toolbox_sql_writer
      required_scopes:
      - extension:invoke
      inputs:
      - name: connection_ref
        value_type: connection_ref
        required: true
      - name: sql
        value_type: text
        required: true
      - name: params
        value_type: object
        required: false
      - name: param_schema
        value_type: object
        required: false
      outputs:
      - name: status
        value_type: text
      - name: rows
        value_type: array
      - name: returned_row_count
        value_type: integer
      result_fields:
      - result.status
      - result.rows
      - result.returned_row_count
      error_codes:
      - invalid_payload
      - write_outcome_unknown
    - operation_id: test_connection
      workflow_visible: false
      operation_kind: action
      description: Validate that the configured Spanner database can list tables.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.status
      - result.connector_id
      - result.metadata.toolbox_prebuilt
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: introspect_schema
      workflow_visible: false
      operation_kind: action
      description: Return a typed Spanner schema snapshot.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.schema_snapshot.schema_version
      - result.schema_snapshot.resources[].resource_id
      - result.schema_snapshot.resources[].columns[].name
      - result.schema_snapshot.resources[].indexes[].columns[]
      - result.resource_count
      error_codes:
      - invalid_config
      - not_found
      - permission_denied
      - connector_runtime_failed
      - unknown_action
    - operation_id: validate_query
      workflow_visible: false
      operation_kind: action
      description: Validate a saved read-only query template against dataset resource scope.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.valid
      - result.read_only
      - result.referenced_resources[]
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: preview_query
      workflow_visible: false
      operation_kind: action
      description: Execute a bounded read-only preview for a validated query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: execute_template
      workflow_visible: false
      operation_kind: action
      description: Execute a saved read-only query template with named parameters and runtime row limits.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.rows[]
      - result.row_count
      - result.output_schema
      - result.truncated
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    - operation_id: infer_output_schema
      workflow_visible: false
      operation_kind: action
      description: Infer output schema from a bounded read-only preview of the query template.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.output_schema
      error_codes:
      - invalid_config
      - connector_runtime_failed
      - unknown_action
    resource_query_manifest:
    - query_id: runtime_health
      cursor_mode: none
      description: Return extension runtime health.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.status
      - result.extension_id
      error_codes:
      - unknown_query
      - connector_runtime_failed
    - query_id: supported_connectors
      cursor_mode: none
      description: Return the supported connector catalog for this extension.
      required_scopes:
      - extension:invoke
      result_fields:
      - result.connectors[].connector_type_id
      - result.connectors[].display_name
      - result.connectors[].database_kind
      - result.connectors[].source_provider
      - result.connectors[].access_mode
      error_codes:
      - unknown_query
      - connector_runtime_failed
