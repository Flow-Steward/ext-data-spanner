name: MCP Toolbox for Databases
version: 1.3.0
tag: v1.3.0
commit: b0010060a939455d91e4f8ba62dc3e72b1892469
source_url: https://github.com/googleapis/mcp-toolbox
license: Apache-2.0
release:
  published_at: 2026-05-21 21:49:59+00:00
  official_linux_amd64_url: https://storage.googleapis.com/mcp-toolbox-for-databases/v1.3.0/linux/amd64/toolbox
  official_linux_amd64_bytes: 287397352
  official_linux_arm64_available: false
build:
  script: scripts/build_toolbox.sh (github.com/Flow-Steward/ext-data-spanner)
  container_image: golang:1.26.10-bookworm@sha256:5de7c99eb78ca5e515a4c340235d0955ec5964a5071c492c15503d7c267da473
  go_version: 1.26.10
  targets:
  - linux-amd64
  - linux-arm64
  flags:
  - -trimpath
  - -buildvcs=false
  - -s
  - -w
  - -buildid=
  registered_prebuilts:
  - spanner
  - spanner-postgres
  local_patch: scripts/patches/0001-flowsteward-driver-bound-query-params.patch
  local_patch_purpose: Native driver-bound query parameters; explicit one-shot ExecContext
    DML; Spanner statement-based Update and Commit without a transaction retry loop.
  network_at_install_or_runtime: false
  dependency_patches:
  - path: scripts/patches/0002-go-security-baseline.patch
    purpose: Apply reviewed module security floors while preserving pinned Toolbox source and native SQL controls.
  patched_dependencies:
    github.com/andybalholm/brotli: v1.3.0
    github.com/go-chi/chi/v5: v5.5.0
    github.com/go-jose/go-jose/v4: v4.1.9
    github.com/klauspost/compress: v1.20.4
    go.opentelemetry.io/otel: v1.47.0
    go.opentelemetry.io/otel/sdk: v1.47.0
    go.opentelemetry.io/otel/exporters/otlp/otlptrace: v1.47.0
    go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp: v1.47.0
    golang.org/x/crypto: v0.58.1-0.20261009181718-2f1f834330b2
    golang.org/x/net: v0.62.0
    golang.org/x/sys: v0.50.0
    golang.org/x/text: v0.44.0
    google.golang.org/grpc: v1.85.0
    github.com/snowflakedb/gosnowflake/v2: v2.2.0
  linked_dependency_inventory: toolbox-provenance.json#binaries (per-target go_modules and go_version)
